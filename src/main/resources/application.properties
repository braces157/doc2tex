spring.application.name=doc2tex
server.address=${SERVER_ADDRESS:127.0.0.1}
server.port=${PORT:8080}
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=21MB
server.error.include-message=never
server.error.include-stacktrace=never
doc2tex.data-dir=${DOC2TEX_DATA_DIR:.data/jobs}
doc2tex.pandoc=${PANDOC_PATH:}
doc2tex.tectonic=${TECTONIC_PATH:}
doc2tex.workers=2
doc2tex.queue-capacity=8
doc2tex.conversion-timeout-seconds=60
doc2tex.preview-timeout-seconds=300
