spring.application.name=doc2tex
spring.config.import=optional:file:.tools/layout-ai/renderer.properties
server.address=${SERVER_ADDRESS:127.0.0.1}
server.port=${PORT:8080}
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=50MB
server.error.include-message=never
server.error.include-stacktrace=never
doc2tex.data-dir=${DOC2TEX_DATA_DIR:.data/jobs}
doc2tex.pandoc=${PANDOC_PATH:}
doc2tex.tectonic=${TECTONIC_PATH:}
doc2tex.workers=2
doc2tex.queue-capacity=8
doc2tex.conversion-timeout-seconds=60
doc2tex.preview-timeout-seconds=300
doc2tex.ai-layout.enabled=${DOC2TEX_AI_LAYOUT_ENABLED:true}
doc2tex.ai-layout.model=${DOC2TEX_LAYOUT_MODEL:.tools/layout-ai/inference.onnx}
doc2tex.ai-layout.renderer=${SOFFICE_PATH:}
doc2tex.ai-layout.max-pages=6
doc2tex.ai-layout.timeout-seconds=90
doc2tex.ai-layout.docker-image=
server.forward-headers-strategy=${FORWARD_HEADERS_STRATEGY:none}
doc2tex.hosting.allowed-hosts=${DOC2TEX_ALLOWED_HOSTS:}
doc2tex.hosting.demo-mode=${DOC2TEX_DEMO_MODE:false}
doc2tex.hosting.trust-proxy-ip=${DOC2TEX_TRUST_PROXY_IP:false}
doc2tex.hosting.retention-minutes=${DOC2TEX_DEMO_RETENTION_MINUTES:60}
doc2tex.hosting.max-jobs=${DOC2TEX_DEMO_MAX_JOBS:50}
doc2tex.hosting.max-jobs-per-session=${DOC2TEX_DEMO_MAX_JOBS_PER_SESSION:10}
doc2tex.hosting.uploads-per-window=${DOC2TEX_DEMO_UPLOADS_PER_WINDOW:10}
doc2tex.hosting.previews-per-window=${DOC2TEX_DEMO_PREVIEWS_PER_WINDOW:20}
doc2tex.hosting.rate-limit-window-minutes=${DOC2TEX_DEMO_RATE_LIMIT_WINDOW_MINUTES:10}
