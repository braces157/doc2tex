name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Restore converters, fonts, and TeX cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .tools
            ~/.cache/Tectonic
            ~/.cache/tectonic
            ~/AppData/Local/TectonicProject
          key: tools-${{ runner.os }}-${{ hashFiles('scripts/setup-*') }}
      - name: Install tools (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/setup-tools.ps1
      - name: Install tools (Linux)
        if: runner.os == 'Linux'
        run: ./scripts/setup-tools.sh
      - name: Install frontend
        run: npm --prefix frontend ci
      - name: Lint frontend
        run: npm --prefix frontend run lint
      - name: Build frontend
        run: npm --prefix frontend run build
      - name: Verify backend and real PDF conversions
        shell: bash
        run: ./mvnw -B verify -Ddoc2tex.test-pdf=true
      - name: Require all regression tests to run
        shell: pwsh
        run: |
          $reports = Get-ChildItem target/surefire-reports/TEST-*.xml
          if ($reports.Count -lt 4) { throw 'Missing backend test reports.' }
          foreach ($report in $reports) {
            [xml]$result = Get-Content $report.FullName
            if ([int]$result.testsuite.skipped -gt 0) { throw "Skipped tests in $($report.Name)" }
          }
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports-${{ runner.os }}
          path: target/surefire-reports/
          retention-days: 14
