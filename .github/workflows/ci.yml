name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Restore converters, fonts, and TeX cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .tools
            ~/.cache/Tectonic
            ~/.cache/tectonic
            ~/AppData/Local/TectonicProject
          key: tools-${{ runner.os }}-${{ hashFiles('scripts/setup-*') }}
      - name: Install tools (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/setup-tools.ps1
      - name: Install tools (Linux)
        if: runner.os == 'Linux'
        run: ./scripts/setup-tools.sh
      - name: Install frontend
        run: npm --prefix frontend ci
      - name: Lint frontend
        run: npm --prefix frontend run lint
      - name: Build frontend
        run: npm --prefix frontend run build
      - name: Install browser test runtime
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Test draft recovery and request failures in the browser
        run: npm --prefix frontend run test:e2e
      - name: Verify backend and real PDF conversions
        shell: bash
        run: ./mvnw -B verify -Ddoc2tex.test-pdf=true
      - name: Require all regression tests to run
        shell: pwsh
        run: |
          $reports = Get-ChildItem target/surefire-reports/TEST-*.xml
          if ($reports.Count -lt 4) { throw 'Missing backend test reports.' }
          foreach ($report in $reports) {
            [xml]$result = Get-Content $report.FullName
            if ([int]$result.testsuite.skipped -gt 0) { throw "Skipped tests in $($report.Name)" }
          }
      - name: Build Windows candidate package
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/package-windows.ps1 -SkipBuild
      - name: Verify packaged Windows launch, conversion, replacement and uninstall
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $taskPackages = @(Get-ChildItem target/windows-package -Directory)
          if ($taskPackages.Count -ne 1) { throw 'Expected exactly one fresh Windows package.' }
          ./scripts/test-windows-package.ps1 -PackageDirectory $taskPackages[0].FullName -EvidenceDirectory target/windows-package-smoke -DownloadTools
      - name: Upload Windows candidate package
        if: runner.os == 'Windows' && success()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-candidate-package
          path: |
            target/windows-package/*.zip
            target/windows-package/*.sha256
          retention-days: 14
      - name: Upload packaged Windows verification evidence
        if: runner.os == 'Windows' && always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-package-evidence
          path: |
            target/windows-package-smoke/result.json
            target/windows-package-smoke/duplicate*.log
            target/windows-package-smoke/helper*.log
            target/windows-package-smoke/**/logs/*.log
            target/windows-package-smoke/*-export.zip
          retention-days: 14
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports-${{ runner.os }}
          path: target/surefire-reports/
          retention-days: 14
      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-reports-${{ runner.os }}
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 14
      - name: Upload PDF fidelity evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pdf-fidelity-${{ runner.os }}
          path: target/fidelity-evidence/
          retention-days: 14
