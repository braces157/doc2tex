name: Feature request
description: Suggest a focused improvement.
title: "feat: "
body:
  - type: textarea
    id: need
    attributes:
      label: What are you trying to do?
      description: Explain the workflow or problem, with a concrete example.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: What should change? Mention alternatives or tradeoffs if helpful.
    validations:
      required: true
